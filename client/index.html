<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
  <!-- Performance: DNS prefetch for external resources -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link rel="dns-prefetch" href="https://docs.google.com" />

  <!-- Primary SEO -->
  <title>REDDOT | AI, Automation, Software & IoT Solutions</title>
  <meta name="description"
    content="REDDOT builds AI agents, intelligent automation, generative AI, software, machine learning, IoT and embedded technology solutions for businesses." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#2563EB" />
  <link rel="canonical" href="https://reddot.org.in/" />

  <!-- Open Graph (Facebook / LinkedIn / WhatsApp) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://reddot.org.in/" />
  <meta property="og:site_name" content="REDDOT" />
  <meta property="og:title" content="REDDOT | AI, Automation, Software & IoT Solutions" />
  <meta property="og:description"
    content="REDDOT builds AI agents, intelligent automation, generative AI, software, machine learning, IoT and embedded technology solutions for businesses." />
  <meta property="og:image" content="https://reddot.org.in/images/reddot%20logo.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="REDDOT" />
  <meta property="og:locale" content="en_IN" />

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="REDDOT | AI, Automation, Software & IoT Solutions" />
  <meta name="twitter:description"
    content="REDDOT builds AI agents, intelligent automation, generative AI, software, machine learning, IoT and embedded technology solutions for businesses." />
  <meta name="twitter:image" content="https://reddot.org.in/images/reddot%20logo.png" />
  <meta name="twitter:image:alt" content="REDDOT" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/images/reddot%20logo.png" />

  <!-- JSON-LD: Organization Schema -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "REDDOT",
        "url": "https://reddot.org.in/",
        "description": "REDDOT builds AI agents, intelligent automation, generative AI, software, machine learning, IoT and embedded technology solutions for businesses.",
        "logo": "https://reddot.org.in/images/reddot%20logo.png",
        "email": "reddot.org123@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Chennai",
          "addressCountry": "India"
        },
        "sameAs": [
          "https://linkedin.com/company/reddot.org.in",
          "https://twitter.com/reddot.org.in",
          "https://github.com/reddot.org.in"
        ]
      }
    </script>

  <!-- JSON-LD: WebSite Schema -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "REDDOT",
        "alternateName": [
          "REDDOT AI"
        ],
        "url": "https://reddot.org.in/"
      }
    </script>

  <!-- Fonts: preconnect + swap for CLS prevention -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet" />
  </noscript>

  <!-- Sitemap reference -->
  <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
