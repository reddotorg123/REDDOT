<body>
  <div id="root"></div>

  <!-- Google Translate Element (Hidden) -->
  <div id="google_translate_element" style="display: none; position: absolute; top: -9999px; left: -9999px;"></div>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,ta,hi,es,de,fr,ja,ar,te,kn,ml',
        autoDisplay: false
      }, 'google_translate_element');
    }

    function clearGoogleTranslateCookies() {
      const hostname = window.location.hostname;
      const parts = hostname.split('.');
      const cookies = ['googtrans'];
      const domains = [
        '',
        hostname,
        '.' + hostname,
        ...(parts.length > 2 ? ['.' + parts.slice(-2).join('.')] : [])
      ];

      cookies.forEach(function(c) {
        domains.forEach(function(d) {
          document.cookie = c + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;' + (d ? ' domain=' + d + ';' : '');
        });
      });
      try {
        localStorage.removeItem('user_selected_lang');
        sessionStorage.removeItem('user_selected_lang');
      } catch (e) {}
    }

    window.changeLanguage = function(langCode) {
      if (!langCode || langCode === 'en') {
        clearGoogleTranslateCookies();
        var select = document.querySelector('.goog-te-combo');
        if (select) {
          select.value = 'en';
          select.dispatchEvent(new Event('change'));
        }
        setTimeout(function() {
          window.location.reload();
        }, 150);
        return;
      }

      try {
        localStorage.setItem('user_selected_lang', langCode);
      } catch (e) {}

      document.cookie = "googtrans=/en/" + langCode + "; path=/;";
      document.cookie = "googtrans=/en/" + langCode + "; domain=" + window.location.hostname + "; path=/;";
      document.cookie = "googtrans=/en/" + langCode + "; domain=." + window.location.hostname + "; path=/;";
      
      var select = document.querySelector('.goog-te-combo');
      if (select) {
        select.value = langCode;
        select.dispatchEvent(new Event('change'));
      } else {
        window.location.reload();
      }
    };

    // Keep header & body flush at top without Google translate banner pushing it down
    setInterval(function() {
      if (document.body && document.body.style.top && document.body.style.top !== '0px') {
        document.body.style.top = '0px';
        document.body.style.position = 'static';
        document.body.style.marginTop = '0px';
      }
      var frames = document.querySelectorAll('.goog-te-banner-frame, iframe[class*="goog-te-banner"], .VIpgJd-ZVi9od-ORHb-Oxf5td, .skiptranslate');
      for (var i = 0; i < frames.length; i++) {
        var el = frames[i];
        if (el.tagName === 'IFRAME') {
          el.style.display = 'none';
          el.style.visibility = 'hidden';
          el.style.height = '0px';
        }
      }
    }, 100);
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
